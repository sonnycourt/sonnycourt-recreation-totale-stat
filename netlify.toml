[build.processing]
skip_processing = false

[build.processing.css]
bundle = true
minify = true

[build.processing.js]
bundle = true
minify = true

[build.processing.images]
compress = true

[functions]
  [functions.daily-views-collector]
    background = true
    timeout = 900  # 15 minutes en secondes

  [functions."generate-email-pack"]
    type = "background"
    timeout = 60

  # Dimanche 23h Paris.
  # CET => 22:00 UTC, CEST => 21:00 UTC. On planifie les 2 pour couvrir DST.
  [functions."transition-webinaire"]
    schedule = "0 21,22 * * 0"

  # Relance post-séance : l'avis reste aussi disponible dans l'espace élève.
  [functions."coaching-review-reminders"]
    schedule = "*/15 * * * *"

  # Les disponibilités restent alignées avec Google Calendar, même si Romain
  # ne rouvre pas sa console entre deux rendez-vous.
  [functions."coaching-sync-scheduled"]
    schedule = "*/15 * * * *"

  # Relances Pay visibles et pilotées depuis l’onglet Automatisations.
  [functions."pay-reminders-scheduled"]
    schedule = "*/15 * * * *"

  # SMS MC2 : précision à la minute pour le LIVE et l'expiration individuelle.
  [functions."mc2-sms-scheduled"]
    schedule = "* * * * *"

  # Emails d'impayés MC2 : Stripe prélève, MailerLite communique.
  [functions."mc2-dunning-scheduled"]
    schedule = "* * * * *"

  [functions."mc2-replay-recovery-scheduled"]
    schedule = "*/5 * * * *"

  # Confirmations MC2 et rappels H-1. Inerte tant que le flag est false.
  [functions."mc2-session-emails-scheduled"]
    schedule = "* * * * *"

  # Confirmation contractuelle MC2. Inerte tant que le flag est false.
  [functions."mc2-contract-document-emails-scheduled"]
    schedule = "* * * * *"

  # Accès Circle MC2 : invitation éventuelle puis ajout idempotent du tag.
  [functions."mc2-circle-onboarding-scheduled"]
    schedule = "* * * * *"

  # Préparation locale des dossiers après les cinq reprises Stripe. OFF par défaut.
  # Aucun transfert externe : les exports exigent une validation humaine séparée.
  [functions."mc2-collection-cases-scheduled"]
    schedule = "*/15 * * * *"
