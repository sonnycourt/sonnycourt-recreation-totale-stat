[build]
command = "npm run build"
publish = "dist"
ignore = "node scripts/block-netlify-auto-build.mjs"

# L’entrée publique /masterclass est servie directement par Astro.
# Elle affiche temporairement la liste d’attente pendant la refonte.

# Ancien slug de la page X-Men -> page de vente principale.
# Netlify conserve les query params, notamment le token personnel ?t=.
[[redirects]]
  from = "/invitation-xmen"
  to = "/invitation"
  status = 301
  force = true

[[redirects]]
  from = "/invitation-xmen/"
  to = "/invitation"
  status = 301
  force = true

