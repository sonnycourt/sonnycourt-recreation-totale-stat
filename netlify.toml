# API redirects for tracking
[[redirects]]
  from = "/live/*"
  to = "/.netlify/functions/mc2-live-redirect?code=:splat"
  status = 200
  force = true

# Lien court du SMS H-1 : le code résout le token côté serveur puis renvoie
