<path d="M28 74H372" stroke="#e9e0d4"/>
<text font-family="Arial, 'Apple Color Emoji', sans-serif" font-size="20" fill="#3c3b34"><tspan x="28" y="111">Sacré Expérience !</tspan><tspan x="28" y="140">L’accompagnement et les consignes</tspan><tspan x="28" y="169">sont claires, précises … Il n’y a plus</tspan><tspan x="28" y="198">qu’à se laisser porter et absorber par</tspan><tspan x="28" y="227">l’expérience … et celle-ci est</tspan><tspan x="28" y="256">incroyable et inspirante . De mon</tspan><tspan x="28" y="285">côté la visualisation a été</tspan><tspan x="28" y="314">grandement amélioré par ce</tspan><tspan x="28" y="343">processus … et pourtant je m’y</tspan><tspan x="28" y="372">connais en états modifiés de</tspan><tspan x="28" y="401">Conscience .. Après ? Je rédige ce</tspan><tspan x="28" y="430">message avec le sourire aux lèvres</tspan><tspan x="28" y="459">et sentiment profond de paix</tspan><tspan x="28" y="488">intérieur !</tspan></text>
