<svg xmlns="http://www.w3.org/2000/svg" width="400" height="524" viewBox="0 0 400 524">
<title>Romain — 5/5</title>
<desc>Sacré Expérience ! L’accompagnement et les consignes sont claires, précises … Il n’y a plus qu’à se laisser porter et absorber par l’expérience … et celle-ci est incroyable et inspirante . De mon côté la visualisation a été grandement amélioré par ce processus … et pourtant je m’y connais en états modifiés de Conscience .. Après ? Je rédige ce message avec le sourire aux lèvres et sentiment profond de paix intérieur !</desc>
<rect x=".5" y=".5" width="399" height="523" rx="20" fill="#fffcf7" stroke="#e4d9c8"/>
<text x="28" y="52" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#353a30">Romain</text>
