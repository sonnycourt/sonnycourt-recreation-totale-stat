<svg xmlns="http://www.w3.org/2000/svg" width="400" height="292" viewBox="0 0 400 292">
<title>Soidikati — 5/5</title>
<desc>La vision de l’objectif est de plus en plus précise. C’est dingue de percevoir autant de détail qu’on avait pas en tête juste avant.

Je me suis sentie sereine, apaisée.</desc>
