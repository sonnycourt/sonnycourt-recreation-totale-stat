<text font-family="Arial, 'Apple Color Emoji', sans-serif" font-size="20" fill="#3c3b34"><tspan x="28" y="111">La vision de l’objectif est de plus en</tspan><tspan x="28" y="140">plus précise. C’est dingue de</tspan><tspan x="28" y="169">percevoir autant de détail qu’on avait</tspan><tspan x="28" y="198">pas en tête juste avant.</tspan><tspan x="28" y="227"></tspan><tspan x="28" y="256">Je me suis sentie sereine, apaisée.</tspan></text>
