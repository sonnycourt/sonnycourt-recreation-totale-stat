<script>
// Dedicated checkout 41041 only. Select a pack, never submit a payment.
(function () {
  if (location.pathname !== '/checkout/delta-vision-cadeaux') return;
  var pack = new URLSearchParams(location.search).get('gift_pack');
  var option = {'1':'0','3':'1','5':'2'}[pack];
  if (option === undefined) return;
  var attempts = 0;
  var timer = setInterval(function () {
    var radio = document.getElementById('option-371834-' + option);
    if (radio && !radio.disabled) {
      clearInterval(timer);
      if (!radio.checked) radio.click();
    } else if (++attempts >= 40) clearInterval(timer);
  }, 250);
})();
</script>
