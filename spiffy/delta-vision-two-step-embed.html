<!-- Delta Vision two-step bridge v2. Additive; only active inside the authorised popup. -->
<script>
(function(){
  var q=new URLSearchParams(location.search), origin=q.get('dv_parent_origin');
  var prices={'/checkout/delta-vision-1':97,'/checkout/delta-vision-standard':147};
  var price=prices[location.pathname.replace(/\/$/,'')];
  if(window.parent===window || q.get('dv_embed')!=='2' || !price)return;
  if(!/^https:\/\/(www\.)?sonnycourt\.com$/.test(origin||'') && !/^https:\/\/[a-z0-9-]+--sonnycourt-recreation-totale\.netlify\.app$/.test(origin||'') && !/^http:\/\/(localhost|127\.0\.0\.1):\d+$/.test(origin||''))return;
  var ids=price===97?{first:'inputText-371921',email:'contactInfo-371920-email',phone:'inputTel-371922',payment:'paymentInfo-371923',terms:'option-371924-0',button:'checkoutButton-371925'}:{first:'inputText-372355',email:'contactInfo-372354-email',phone:'inputTel-372356',payment:'paymentInfo-372357',terms:'option-372358-0',button:'checkoutButton-372359'};
  var preload=q.get('dv_preload')==='1',activated=!preload,warmAnnounced=false,visit=null;
  var expectedName=preload?'':q.get('name_first')||'',expectedEmail=preload?'':(q.get('email')||'').toLowerCase(),count=0,announced=false,lastHeight=0,scheduled=false;
  if(!preload&&(!expectedName.trim()||!/^\S+@\S+\.\S+$/.test(expectedEmail)))return;
  document.documentElement.classList.add('dv-two-step');
  function send(type,data){window.parent.postMessage(Object.assign({type:type,version:2},data||{}),origin);}
  if(preload){
    document.addEventListener('submit',function(event){if(!activated){event.preventDefault();event.stopImmediatePropagation();}},true);
    window.addEventListener('message',function(event){
      var data=event.data;
      if(activated||event.source!==window.parent||event.origin!==origin||!data||data.type!=='dv:payment-identity'||data.version!==2)return;
      if(typeof data.firstName!=='string'||!data.firstName.trim()||data.firstName.length>100||typeof data.email!=='string'||data.email.length>254||!/^\S+@\S+\.\S+$/.test(data.email))return;
      expectedName=data.firstName.trim();expectedEmail=data.email.trim().toLowerCase();visit=data.visit;activated=true;count=0;check();
    });
  }
  function check(){
    scheduled=false;
    var root=document.querySelector('.checkout'),first=document.getElementById(ids.first),email=document.getElementById(ids.email),button=document.getElementById(ids.button),terms=document.getElementById(ids.terms),payment=document.getElementById(ids.payment);
    if(!root||!first||!email||!button||!terms||!payment){if(++count<160)setTimeout(check,150);return;}
    if(!activated){if(!warmAnnounced){warmAnnounced=true;send('dv:payment-warm',{price:price});}return;}
    var changed=false;
    [[first,expectedName],[email,expectedEmail]].forEach(function(pair){
      if(pair[0].value.trim()!==pair[1]){Object.getOwnPropertyDescriptor(HTMLInputElement.prototype,'value').set.call(pair[0],pair[1]);pair[0].dispatchEvent(new Event('input',{bubbles:true}));pair[0].dispatchEvent(new Event('change',{bubbles:true}));changed=true;}
    });
    if(changed){setTimeout(check,150);return;}
    // Verify the real provider total (including its configured discount), never set a price.
    var totals=Array.from(root.querySelectorAll('.order-summary__due-today .notranslate')).map(function(el){return el.textContent.replace(/\s/g,'');});
    var valid=totals.length>0 && totals.every(function(text){return new RegExp('^(?:€'+price+'(?:[.,]00)?|'+price+'(?:[.,]00)?€)$').test(text);});
    if(!valid){document.documentElement.classList.remove('dv-two-step-ready');if(announced)send('dv:payment-error',{code:'price_mismatch'});if(++count<160)setTimeout(check,150);return;}
    [first,email,document.getElementById(ids.phone)].filter(Boolean).forEach(function(field){var block=field.closest('.section.block');if(block)block.setAttribute('data-dv-prefilled','true');});
    var label=payment.querySelector('.payment-type__label');if(label&&label.textContent!=='Carte bancaire')label.textContent='Carte bancaire';
    var labelText='J’accède à Delta Vision';
    Array.from(button.childNodes).forEach(function(node){if(node.nodeType===3&&/(?:Accéder|J’accède) à Delta Vision/.test(node.textContent)&&node.textContent.trim()!==labelText)node.textContent=' '+labelText+' ';});
    if(!root.querySelector('[data-dv-guarantee]')){var guarantee=document.createElement('div');guarantee.setAttribute('data-dv-guarantee','');guarantee.innerHTML='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 2 8 4v6c0 5-8 10-8 10S4 17 4 12V6l8-4Z"/><path d="m8 12 3 3 5-6"/></svg><span><strong>Satisfait ou remboursé</strong><span>Pendant 14 jours</span></span>';button.parentNode.appendChild(guarantee);}
    if(!root.querySelector('[data-dv-review]')){var review=document.createElement('figure');review.setAttribute('data-dv-review','');review.innerHTML='<figcaption><strong>Marcus</strong><span aria-label="5 étoiles sur 5">★★★★★</span></figcaption><blockquote>Seul regret ! avoir découvert cette méthode à plus de 40 ans 😅 Mais comme on dit, vaut mieux tard que jamais.</blockquote>';button.parentNode.appendChild(review);}
    document.documentElement.classList.add('dv-two-step-ready');
    if(!announced){announced=true;send('dv:payment-ready',{identityReady:true,price:price});if(window.ResizeObserver)new ResizeObserver(measure).observe(root);if(preload)document.dispatchEvent(new CustomEvent('dv:checkout-activated',{detail:{visit:visit}}));}
    measure();
  }
  function measure(){var form=document.querySelector('.checkout-form');if(!form)return;var height=Math.ceil(form.getBoundingClientRect().bottom+window.scrollY+12);if(height!==lastHeight){lastHeight=height;send('dv:payment-height',{height:height});}}
  function schedule(){if(!scheduled){scheduled=true;setTimeout(check,80);}}
  new MutationObserver(schedule).observe(document.documentElement,{childList:true,subtree:true,characterData:true});
  if(window.checkout&&typeof window.checkout.ready==='function')window.checkout.ready(check);else check();
})();
</script>
<!-- Count a warmed checkout only after confirmed registration and actual activation. -->
<script>
(function(){
  if(new URLSearchParams(location.search).get('dv_preload')!=='1')return;
  var checkout={'/checkout/delta-vision-1':'41049','/checkout/delta-vision-standard':'41096'}[location.pathname.replace(/\/$/,'')];
  if(!checkout)return;
  document.addEventListener('dv:checkout-activated',function(event){
    var visit=event.detail&&event.detail.visit;
    if(!/^\w{8}-\w{4}-4\w{3}-[89ab]\w{3}-\w{12}$/i.test(visit||'')||!window.crypto||!crypto.randomUUID)return;
    fetch('https://sonnycourt.com/.netlify/functions/delta-vision-checkout-track',{method:'POST',credentials:'omit',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:crypto.randomUUID(),visit_id:visit,checkout:checkout}),keepalive:true}).catch(function(){});
  },{once:true});
})();
</script>

.dv-two-step .checkout .terms,.dv-two-step .checkout .custom-control-label,.dv-two-step .checkout .custom-control-label p{font-size:11px!important;line-height:20px!important;color:#292923!important}

.dv-two-step .checkout .payment-type__icon{filter:none!important;opacity:1!important}

.dv-two-step .checkout [data-dv-review] figcaption{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:8px;font-size:12px}

</style>
